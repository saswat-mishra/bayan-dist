[project]
name = "bayan"
version = "0.1.0"
description = "Bayan — graded certification for diagnostic data releases from air-gapped AI deployments (reference implementation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "cryptography>=42",
  "jsonschema>=4.21",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlglot>=23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "mypy>=1.10",
]

[project.scripts]
bayan-verify = "bayan_verify.cli:main"
bayand = "bayan_gate.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["packages/core", "packages/gate", "packages/sdk", "packages/verify"]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/core/bayan_core",
  "packages/gate/bayan_gate",
  "packages/sdk/bayan_sdk",
  "packages/verify/bayan_verify",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = ["bench: benchmark gates that assert a latency budget"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["packages/core/bayan_core"]

[[tool.mypy.overrides]]
module = ["sqlglot", "sqlglot.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["bayan_core"]
