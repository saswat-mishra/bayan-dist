[project]
name = "bayan"
version = "0.5.2"
description = "Bayan — graded certification for diagnostic data releases from air-gapped AI deployments (reference implementation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "cryptography>=42",
  "jsonschema>=4.21",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlglot>=23",
]

[project.scripts]
bayan-verify = "bayan_verify.cli:main"
bayand = "bayan_gate.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["packages/core", "packages/gate", "packages/sdk", "packages/verify"]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/core/bayan_core",
  "packages/gate/bayan_gate",
  "packages/sdk/bayan_sdk",
  "packages/verify/bayan_verify",
]
